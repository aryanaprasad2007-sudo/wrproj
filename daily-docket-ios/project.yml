name: DailyDocket
options:
  bundleIdPrefix: com.aryanprasad
  deploymentTarget:
    iOS: "16.0"
    watchOS: "10.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  DailyDocket:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DailyDocket
    info:
      path: DailyDocket/Info.plist
    entitlements:
      path: DailyDocket/DailyDocket.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aryanprasad.dailydocket
        # Lets a hard-deadline reminder (NotificationScheduler.swift) mark
        # itself .timeSensitive so it can break through Focus/DND. Works
        # for development builds on your own device as-is; App Store
        # distribution requires a separate one-time capability request to
        # Apple — see the README's Notifications section.
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aryanprasad.dailydocket
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: DailyDocketWidgetExtension
        embed: true
      - target: DailyDocketWatch
        embed: true

  # A Home Screen widget showing today's spotlight with a live countdown.
  # Deliberately shares almost no code with the app target — see the doc
  # comment on WidgetBridge.swift for why the widget only ever reads a
  # precomputed snapshot instead of fetching/parsing calendars itself.
  DailyDocketWidgetExtension:
    type: app-extension
    platform: iOS
    # containerBackground(for:) (the non-deprecated widget background API)
    # needs iOS 17+. The widget can require a newer OS than the app that
    # ships it — it just won't be offered to devices below its own minimum.
    deploymentTarget: "17.0"
    sources:
      - path: DailyDocketWidget
      - path: DailyDocket/Models/WidgetSnapshot.swift
      - path: DailyDocket/Services/WidgetBridge.swift
    info:
      path: DailyDocketWidget/Info.plist
    entitlements:
      path: DailyDocketWidget/DailyDocketWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aryanprasad.dailydocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aryanprasad.dailydocket.DailyDocketWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"

  # watchOS companion app — mostly a required host for the complication
  # below (a complication extension can't ship without one). See
  # DailyDocketWatch/WatchContentView.swift's doc comment.
  DailyDocketWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: DailyDocketWatch
      - path: DailyDocket/Models/WidgetSnapshot.swift
      - path: DailyDocket/Services/WidgetBridge.swift
    info:
      path: DailyDocketWatch/Info.plist
    entitlements:
      path: DailyDocketWatch/DailyDocketWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aryanprasad.dailydocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aryanprasad.dailydocket.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: "NO"
    dependencies:
      - target: DailyDocketWatchWidgetExtension
        embed: true

  # The actual complication — a small/inline/circular WidgetKit extension,
  # same TimelineProvider-reads-a-precomputed-snapshot pattern as
  # DailyDocketWidgetExtension, just with watchOS's accessory* families
  # instead of systemSmall/systemMedium.
  DailyDocketWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: DailyDocketWatchWidget
      - path: DailyDocket/Models/WidgetSnapshot.swift
      - path: DailyDocket/Services/WidgetBridge.swift
    info:
      path: DailyDocketWatchWidget/Info.plist
    entitlements:
      path: DailyDocketWatchWidget/DailyDocketWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aryanprasad.dailydocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aryanprasad.dailydocket.watchkitapp.DailyDocketWatchWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
