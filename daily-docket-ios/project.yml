name: DailyDocket
options:
  bundleIdPrefix: com.aryanprasad
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  DailyDocket:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DailyDocket
    info:
      path: DailyDocket/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aryanprasad.dailydocket
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
